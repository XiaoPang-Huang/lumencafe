# 流光咖啡馆本地/服务器一体化编排：PostgreSQL 16 + FastAPI
# 用法：cp .env.example .env 后 `docker compose up -d --build`
services:
  db:
    # tag@digest 锁定（D6）：本地已审计版本（PG 18.6，≥18.5 已修 2026-08 高危批次）。
    # 远端 18-alpine 浮动 tag 已前移，钉 digest 保可复现；升级须走 D13 影响面评估。
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumencafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumencafe}
      POSTGRES_DB: lumencafe
    volumes:
      # PG 18+ 镜像要求挂载父目录 /var/lib/postgresql（数据存版本号子目录，便于未来 pg_upgrade）
      - pgdata:/var/lib/postgresql
    ports:
      # 暴露到宿主机，供本机 venv 直连开发/验证（compose 内 api 走服务名 db）
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumencafe -d lumencafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 2核4G 小池：与后端连接池 pool_size=5 + max_overflow=10（合计 ≤15 < 20）匹配
    command: ["postgres", "-c", "max_connections=20"]

  api:
    build:
      context: ./backend
      args:
        # 国内构建走清华镜像加速；服务器/CI 可在 .env 覆盖为官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    # .env 缺失时不拒绝启动（compose >= 2.24），由 config.py 的默认值兜底
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx;httpx.get('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # 业务日期边界（昨日/本周/本月）按北京时间切换；不设则容器默认 UTC 零点偏移 8 小时
      TZ: Asia/Shanghai
      # Skill 文件夹库根目录（Agent Skills 开放标准：skills/<slug>/SKILL.md）。
      # 未设置时后端回落默认路径；容器内固定 /app/skills 并挂载宿主机卷持久化
      SKILL_LIBRARY_DIR: /app/skills
      # 备份状态卷（底座步 5）：读 backup 容器写入的 last_run.json，/api/status 状态灯数据源
      LUMEN_BACKUP_STATE_DIR: /var/lib/backup-state
    volumes:
      # 技能库持久化：安装的 skill 包存宿主机 ./skills，重建容器不丢失；
      # 手工放入的本地包（含 SKILL.md）放这里即被识别（管理弹窗显示为「本地」）
      - ./skills:/app/skills
      # 备份状态共享卷（backup 容器写、api 只读）：/api/status 的 backup 灯数据源
      - backup_state:/var/lib/backup-state:ro
    # 启动即迁移（Alembic 替代 create_all）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 本机备份（底座步 4，2026-10-25 拍板）：restic 加密增量备份 pg_dump + skills
  # 到宿主机异目录（防误删不防盘坏）。调度 = 容器内 sh 循环 24h（2 人规模不引
  # cron 守护）；状态灯数据源 = backup_state 卷 last_run.json（成功/失败都写）。
  backup:
    build:
      context: ./deploy/backup
    image: lumencafe-backup:0.2.0
    restart: unless-stopped
    # 备份脚本为唯一入口；--once 跑一轮即退（手动触发/验收用），默认 24h 循环
    entrypoint: ["sh", "/backup/backup.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      # 仓库加密口令：缺失时 compose 直接拒绝启动（失败要显式可见，不静默跳过备份）
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?请在 .env 配置 RESTIC_PASSWORD（长随机串，openssl rand -hex 32 生成）}
      RESTIC_REPOSITORY: /repo
      # pg_dump 目标（compose 内网直连 db；密码与 db 服务同源，不经公网）
      PGHOST: db
      PGUSER: lumencafe
      PGDATABASE: lumencafe
      PGPASSWORD: ${POSTGRES_PASSWORD:-lumencafe}
    volumes:
      # 仓库落盘宿主机异目录（本机拍板 E:/backups/lumencafe-restic，经 .env 覆盖；
      # 默认 ./backups/restic 保证无 .env 也能起）。服务器部署在 .env 改 Linux 路径。
      - ${BACKUP_REPO_HOST_PATH:-./backups/restic}:/repo
      # 状态文件共享卷：api 容器只读挂载 → /api/status 备份灯
      - backup_state:/state
      # 技能库只读参与备份
      - ./skills:/skills:ro
      # 备份脚本（仓库内版本化，改脚本即生效，无需重建镜像）
      - ./deploy/backup/backup.sh:/backup/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  # Uptime Kuma 监控（底座步 5）：管服务存活探测与告警（通知渠道用户在 Kuma 内自配）。
  # 不发布宿主机端口，只经 Caddy 反代（Kuma 自带登录）；slim 变体去掉浏览器引擎
  # chromium，trivy 面大幅下降（1.74GB→545MB；CRITICAL 13→9），选型论证见锁定清单 §5.4。
  # 访问入口（Caddy 路由形态）按需求会话拍板执行，见 Caddyfile 注释。
  kuma:
    image: louislam/uptime-kuma:2.5.7-slim@sha256:4837e2b531b118d2fad24430fabed1488b14542f03b2bebf035497271b3a1ee8
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data

  # 本地反代：纯 IP 访问 http://127.0.0.1（或局域网 http://<本机IP>，手机调试用）→ api（SSE 不缓冲）。服务器部署用根目录 Caddyfile（IP 直连模式）
  caddy:
    # IP 直连模式用官方镜像即可（自签证书，无 DNS-01 需求）。
    # 切域名模式时改回：
    #   build: ./deploy/caddy
    #   image: lumencafe-caddy:latest
    # 详见 deploy/caddy/Dockerfile 与 docs/部署指南-v1.md §1.1
    # tag@digest 锁定（D6）：本地已审计版本（v2.11.7，≥2.11.4 已修 CVE-2026-27587 等）。
    # 远端 2-alpine 浮动 tag 已前移，钉 digest 保可复现；升级须走 D13 影响面评估。
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      # 仅域名模式（DNS-01）需要：DNSPod API 令牌，格式「ID,Key」，在 .env 配置。
      # IP 模式下不使用，留着备用
      DNSPOD_TOKEN: ${DNSPOD_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      # 8443：未备案域名临时方案（80/443 被腾讯云拦截，见 Caddyfile 头部说明）；
      # 备案通过后随 Caddyfile 一起删掉这行
      - "8443:8443"
      # 8444：Uptime Kuma 监控台（底座步 5）；Kuma 容器不发布端口，唯一入口即 Caddy 此口
      - "8444:8444"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_state:
  kuma_data:
