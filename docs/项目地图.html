<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流光咖啡馆 · 项目地图</title>
<style>
  :root{
    --brand:#0064E0; --brand-soft:rgba(0,100,224,.08);
    --bg:#F5F6F8; --card:#FFFFFF; --border:#E6E8EC;
    --text:#1D2129; --text-2:#4E5969; --text-3:#86909C;
    --mono:"SF Mono",Consolas,"Cascadia Mono",monospace;
    --radius:14px;
    --shadow:0 1px 2px rgba(29,33,41,.04),0 4px 16px rgba(29,33,41,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181D; --card:#1F2229; --border:#2E323B;
      --text:#F2F3F5; --text-2:#C9CDD4; --text-3:#8A919E;
      --brand-soft:rgba(0,100,224,.18);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Manrope","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding:32px 20px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:24px;letter-spacing:.5px}
  h1 .cup{color:var(--brand)}
  .ver{font-size:12px;color:var(--text-3);border:1px solid var(--border);border-radius:99px;padding:2px 10px}
  .sub{color:var(--text-3);font-size:13.5px;margin-bottom:22px}
  .sub a{color:var(--brand);text-decoration:none}
  .sub a:hover{text-decoration:underline}

  /* 搜索框 */
  .search{
    position:sticky;top:14px;z-index:20;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 16px;box-shadow:var(--shadow);margin-bottom:26px;
  }
  .search svg{flex:none;color:var(--text-3)}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--text);
    font-size:15px;font-family:inherit;
  }
  .search kbd{
    font-size:11px;color:var(--text-3);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;font-family:var(--mono);
  }
  .search .clear{border:0;background:none;color:var(--text-3);cursor:pointer;font-size:16px;display:none}
  .search .clear:hover{color:var(--text)}

  section{margin-bottom:36px}
  .sec-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;margin-bottom:12px}
  .sec-title .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .sec-note{font-size:12.5px;color:var(--text-3);font-weight:400;margin-left:2px}

  /* 任务速查表 */
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  th,td{text-align:left;padding:10px 16px;font-size:13.5px;vertical-align:top}
  thead th{
    background:var(--brand-soft);color:var(--text-2);font-size:12px;font-weight:600;
    letter-spacing:.5px;border-bottom:1px solid var(--border);
  }
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--brand-soft)}
  tbody tr + tr td{border-top:1px solid var(--border)}
  td.task{color:var(--text);white-space:nowrap}
  td.task .tag{font-size:11px;color:var(--text-3);margin-left:6px}
  td.path{font-family:var(--mono);font-size:12.5px;color:var(--text-2);word-break:break-all}
  td.path .copy{opacity:0;color:var(--brand);margin-left:8px;transition:opacity .12s;font-size:11px}
  tr:hover .copy{opacity:1}
  .empty{display:none;text-align:center;color:var(--text-3);padding:26px;font-size:13.5px}

  /* 目录树 */
  .trees{display:grid;grid-template-columns:1fr;gap:14px}
  .tree{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .tree-head{
    display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;
    border-bottom:1px solid var(--border);transition:background .12s;
  }
  .tree-head:hover{background:var(--brand-soft)}
  .tree-head .chev{transition:transform .18s;color:var(--text-3);flex:none}
  .tree.open .chev{transform:rotate(90deg)}
  .tree-head .name{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--brand)}
  .tree-head .desc{font-size:12.5px;color:var(--text-3);flex:1}
  .tree-head .count{font-size:11px;color:var(--text-3);background:var(--brand-soft);
    border-radius:99px;padding:1px 9px;font-family:var(--mono)}
  .tree-body{display:none;padding:8px 0}
  .tree.open .tree-body{display:block}
  .node{display:flex;align-items:baseline;gap:8px;padding:6px 16px;font-size:13px;cursor:pointer}
  .node:hover{background:var(--brand-soft)}
  .node .p{font-family:var(--mono);font-size:12.5px;color:var(--text-2);word-break:break-all}
  .node .p b{color:var(--text);font-weight:600}
  .node .d{color:var(--text-3);font-size:12.5px}
  .node.hidden{display:none}

  /* 文档契约卡片 */
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .doc-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;
  }
  .doc-card:hover{transform:translateY(-2px);border-color:var(--brand)}
  .doc-card .t{font-weight:700;font-size:14px;margin-bottom:4px}
  .doc-card .w{font-size:12.5px;color:var(--text-2);margin-bottom:8px}
  .doc-card .u{font-size:12px;color:var(--text-3)}
  .doc-card a{color:var(--brand);text-decoration:none;font-family:var(--mono);font-size:12px}
  .doc-card a:hover{text-decoration:underline}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);font-size:13px;padding:9px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.3,1);z-index:99;
    font-family:var(--mono);max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  mark{background:rgba(255,196,0,.35);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="cup">☕</span> 流光咖啡馆 · 项目地图</h1>
    <span class="ver">v1 · 2026-11-11 重构期</span>
  </header>
  <p class="sub">10 秒定位"要改的东西在哪"。点任意一行即可复制路径。<b>注意：旧 Python 栈已删除，项目重构中（新栈 Node：pi/chord），服务端代码尚未落地。</b>Markdown 版：<a href="项目地图-v1.md">项目地图-v1.md</a> ｜ 新架构契约：<a href="白皮书-v3.md">白皮书-v3.md</a></p>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="搜索：白皮书 / 样式 / 图标 / 原型 / 决策……" autocomplete="off">
    <button class="clear" id="clearBtn" title="清空">✕</button>
    <kbd>/</kbd>
  </div>

  <!-- ① 按任务找位置 -->
  <section>
    <div class="sec-title"><span class="dot"></span>按任务找位置<span class="sec-note">点击行复制目标路径</span></div>
    <table id="taskTable">
      <thead><tr><th style="width:38%">我要……</th><th>去这里</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="taskEmpty">没有匹配的任务，换个关键词试试（比如「迁移」「样式」）</div>
  </section>

  <!-- ② 目录结构 -->
  <section>
    <div class="sec-title"><span class="dot"></span>目录结构<span class="sec-note">点分组标题展开 / 收起，点行复制路径</span></div>
    <div class="trees" id="trees"></div>
    <div class="empty" id="treeEmpty">没有匹配的目录条目</div>
  </section>

  <!-- ③ 文档契约 -->
  <section>
    <div class="sec-title"><span class="dot"></span>文档契约<span class="sec-note">产品决策以白皮书 v3 为准</span></div>
    <div class="docs" id="docs"></div>
  </section>

</div>
<div id="toast"></div>

<script>
/* ============ 数据（改目录结构时同步这里 + 项目地图-v1.md） ============ */

const TASKS = [
  {t:"看新架构怎么设计", tag:"文档", p:"docs/白皮书-v3.md", d:"新架构唯一产品契约；推演过程见 pi-workbench-architecture.html"},
  {t:"产品决策 / 新应用立项", tag:"文档", p:"docs/白皮书-v3.md", d:"先更新白皮书再动手（决策清单见 §16）"},
  {t:"改页面结构 / 交互 / 路由", tag:"前端", p:"prototype/v2/assets/js/app.js", d:"改完 bump index.html 的 ?v= 版本号"},
  {t:"改样式", tag:"前端", p:"prototype/v2/assets/css/main.css", d:"同样记得 bump ?v="},
  {t:"改演示数据", tag:"前端", p:"prototype/v2/assets/js/data.js", d:"金额一律「分」"},
  {t:"加图标", tag:"前端", p:"prototype/v2/assets/icons/", d:"放 SVG → icons.js 注册 → data-ic 引用"},
  {t:"设计 / 改版界面", tag:"前端", p:"prototype/v2/", d:"先查 AGENTS.md §一参考池，拍板后再动代码"},
  {t:"查旧栈怎么实现的", tag:"参考", p:"E:/backups/lumencafe-oldstack-*.tar.gz", d:"旧 Python 栈 2026-11-11 删除，备份在此 + git 历史"},
  {t:"查之前为什么这么定", tag:"记忆", p:".workbuddy/memory/MEMORY.md", d:"+ 每日日志；白皮书修订记录"},
  {t:"新栈代码落地后", tag:"待办", p:"（尚未创建）", d:"按白皮书 §13 打磨顺序实现，回来补本地图 §1/§5"},
];

const TREES = [
  {name:"prototype/v2/", desc:"前端交互原型（拍板用，纯静态，新栈继续用）", nodes:[
    ["index.html","外壳 + 全局弹层 + ?v= 版本号"],
    ["assets/js/api.js","API 客户端层（token 存取 + fetch/SSE 封装 + 401 跳登录）"],
    ["assets/js/app.js","路由 + 页面模板 + ⌘K 面板 + 全部事件委托"],
    ["assets/js/data.js","演示数据（金额单位：分）"],
    ["assets/js/icons.js","data-ic 图标注入"],
    ["assets/css/main.css","全部样式"],
    ["assets/icons/","SVG 源 + build-icons.js"],
    ["assets/fonts/","Manrope woff2（本地）"],
  ]},
  {name:"docs/", desc:"新架构契约 + 常备 + 旧栈历史 + 工具（2026-11-11 整理）", nodes:[
    ["白皮书-v3.md","新架构唯一产品契约：pi 清单/官方不管的事/存储分层/六层/三应用/RAG/升级纪律/§16 决策清单"],
    ["pi-workbench-architecture.html","新架构讨论稿（大白话版 v1.3）；正式结论以白皮书 v3 为准"],
    ["团队协作规范-v1.md","交付流程、Git 规范、DoD（跟技术栈无关）"],
    ["论文数据源目录-v1.md","34 个学术源选型清单（跟技术栈无关）"],
    ["部署指南-v1.md","【旧栈·历史】对应代码已删；新栈部署方式待重写"],
    ["依赖锁定清单-v1.md","【旧栈·历史】对应代码已删；锁定纪律仍有效（见白皮书 §14）"],
    ["架构总览-v1.html","【旧栈·历史】FastAPI/Hatchet/pi-runner 架构图，仅留档"],
    ["项目地图-v1.md / .html","本文（目录结构变化时同步更新）"],
  ]},
  {name:"根目录 & 其他", desc:"契约 · 许可 · 不入库目录", nodes:[
    ["AGENTS.md","设计强制规则 + 工程约定 + 关键产品决策（最高优先级）"],
    ["README.md","项目状态（重构中）、新架构一句话、目录说明"],
    ["skills/","Skill 文件夹库（运行期数据，Agent Skills 开放标准）"],
    ["LICENSE","MIT 许可"],
    [".gitignore","环境与密钥不入库；旧栈 Python 段可在新栈落地后清理"],
    [".workbuddy/","AI 协作记忆（日志 + 长期笔记，不入库）"],
  ]},
];

const DOCS = [
  {t:"白皮书 v3 · 新架构产品契约", w:"pi 全家桶清单 / 官方不管的事 / 存储分层（SQLite+PG/pgvector）/ 六层 / 三应用 / 慢活 / RAG / 升级纪律 / 2C4G 增补裁剪 / §16 决策清单", u:"白皮书-v3.md"},
  {t:"新架构讨论稿 v1.3", w:"白皮书 v3 的上游推演（大白话版）；正式结论以白皮书 v3 为准", u:"pi-workbench-architecture.html"},
  {t:"团队协作规范 v1", w:"八步交付流程、Git 规范、完成定义 DoD（跟技术栈无关）", u:"团队协作规范-v1.md"},
  {t:"论文数据源目录 v1", w:"34 个学术源选型清单（跟技术栈无关）", u:"论文数据源目录-v1.md"},
  {t:"【旧栈·历史】部署指南 v1", w:"对应代码已删；旧 Docker Compose 部署方式，新栈部署待重写", u:"部署指南-v1.md"},
  {t:"【旧栈·历史】依赖锁定清单 v1", w:"对应代码已删；锁定纪律本身仍有效（见白皮书 §14）", u:"依赖锁定清单-v1.md"},
  {t:"【旧栈·历史】架构总览 v1.1", w:"FastAPI/Hatchet/pi-runner 架构图；代码已删，仅留档参考", u:"架构总览-v1.html"},
  {t:"AGENTS.md", w:"设计强制规则 + 工程约定 + 关键产品决策（最高优先级）", u:"../AGENTS.md"},
];

/* ============ 渲染 ============ */
const $ = s => document.querySelector(s);

function renderTasks(){
  $("table tbody").innerHTML = TASKS.map((x,i)=>`
    <tr data-i="${i}" data-hay="${(x.t+x.tag+x.p+x.d).toLowerCase()}">
      <td class="task">${x.t}<span class="tag">${x.tag}</span></td>
      <td class="path">${x.p}<span class="copy">⧉ 复制</span><br><span style="font-family:inherit;color:var(--text-3);font-size:12px">${x.d}</span></td>
    </tr>`).join("");
  $("table tbody").addEventListener("click", e=>{
    const tr = e.target.closest("tr"); if(!tr) return;
    copyPath(TASKS[tr.dataset.i].p);
  });
}

function renderTrees(){
  $("#trees").innerHTML = TREES.map((g,gi)=>`
    <div class="tree${gi===0?" open":""}" data-g="${gi}">
      <div class="tree-head">
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        <span class="name">${g.name}</span>
        <span class="desc">${g.desc}</span>
        <span class="count">${g.nodes.length}</span>
      </div>
      <div class="tree-body">
        ${g.nodes.map((n,ni)=>`<div class="node" data-g="${gi}" data-n="${ni}" data-hay="${(n[0]+n[1]).toLowerCase()}"><span class="p">├─ <b>${n[0]}</b></span><span class="d">${n[1]}</span></div>`).join("")}
      </div>
    </div>`).join("");
  $("#trees").addEventListener("click", e=>{
    const node = e.target.closest(".node");
    if(node){ copyPath(TREES[node.dataset.g].nodes[node.dataset.n][0]); return; }
    const head = e.target.closest(".tree-head");
    if(head) head.parentElement.classList.toggle("open");
  });
}

function renderDocs(){
  $("#docs").innerHTML = DOCS.map(d=>`
    <div class="doc-card" data-hay="${(d.t+d.w+d.u).toLowerCase()}">
      <div class="t">${d.t}</div>
      <div class="w">${d.w}</div>
      <a href="${d.u}">${d.u}</a>
    </div>`).join("");
}

/* ============ 搜索 & 复制 ============ */
function filter(kw){
  kw = kw.trim().toLowerCase();
  let hitTask=0, hitTree=0;
  document.querySelectorAll("#taskTable tbody tr").forEach(tr=>{
    const hit = !kw || tr.dataset.hay.includes(kw);
    tr.style.display = hit ? "" : "none"; if(hit) hitTask++;
  });
  document.querySelectorAll(".tree").forEach(tree=>{
    let n=0;
    tree.querySelectorAll(".node").forEach(node=>{
      const hit = !kw || node.dataset.hay.includes(kw);
      node.classList.toggle("hidden", !hit); if(hit) n++;
    });
    const gHit = !kw || n>0 || tree.querySelector(".tree-head .name").textContent.toLowerCase().includes(kw);
    tree.style.display = gHit ? "" : "none";
    if(kw && n>0) tree.classList.add("open");
    hitTree += n;
  });
  document.querySelectorAll(".doc-card").forEach(c=>{
    c.style.display = (!kw || c.dataset.hay.includes(kw)) ? "" : "none";
  });
  $("#taskEmpty").style.display = hitTask ? "none" : "";
  $("#treeEmpty").style.display = hitTree ? "none" : "";
}

let toastTimer;
function copyPath(p){
  navigator.clipboard.writeText(p).then(()=>{
    const t = $("#toast");
    t.textContent = "已复制  " + p;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
  });
}

renderTasks(); renderTrees(); renderDocs();
const q = $("#q");
q.addEventListener("input", ()=>{ filter(q.value); $("#clearBtn").style.display = q.value ? "" : "none"; });
$("#clearBtn").addEventListener("click", ()=>{ q.value=""; filter(""); q.focus(); });
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if(e.key==="Escape" && document.activeElement===q){ q.value=""; filter(""); }
});
</script>
</body>
</html>
