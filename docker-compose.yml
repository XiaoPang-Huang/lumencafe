# 流光咖啡馆本地/服务器一体化编排：PostgreSQL 16 + FastAPI
# 用法：cp .env.example .env 后 `docker compose up -d --build`
services:
  db:
    # tag@digest 锁定（D6）：本地已审计版本（PG 18.6，≥18.5 已修 2026-08 高危批次）。
    # 远端 18-alpine 浮动 tag 已前移，钉 digest 保可复现；升级须走 D13 影响面评估。
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumencafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumencafe}
      POSTGRES_DB: lumencafe
      # 库层时区（CURRENT_DATE/日期约束 ck_money_txn_date 依赖它）：不设则 UTC，
      # 凌晨窗口「本地今天」会被约束判成未来日期而拒绝插入（2026-10-27 凌晨实测踩中）
      TZ: Asia/Shanghai
    volumes:
      # PG 18+ 镜像要求挂载父目录 /var/lib/postgresql（数据存版本号子目录，便于未来 pg_upgrade）
      - pgdata:/var/lib/postgresql
    ports:
      # 暴露到宿主机，供本机 venv 直连开发/验证（compose 内 api 走服务名 db）
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumencafe -d lumencafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 2核4G 小池上调至 100：原 20 为 api 独占口径（pool 5+10 ≤15），论文域步 B 起
    # hatchet 引擎（API/scheduler/controllers 多进程池）共享本库，实测起步即 >20；
    # 100 连接 × PG ~5-8MB 头 ≈ ≤800MB 极端占用，常态 30-50，4G 可承受
    command: ["postgres", "-c", "max_connections=100"]

  api:
    build:
      context: ./backend
      args:
        # 国内构建走清华镜像加速；服务器/CI 可在 .env 覆盖为官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    # 加入 sandbox 网：pi-runner 走容器网内调主体（步 5 主体接入的前提）
    networks: [default, sandbox]
    # .env 缺失时不拒绝启动（compose >= 2.24），由 config.py 的默认值兜底
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx;httpx.get('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # 业务日期边界（昨日/本周/本月）按北京时间切换；不设则容器默认 UTC 零点偏移 8 小时
      TZ: Asia/Shanghai
      # Skill 文件夹库根目录（Agent Skills 开放标准：skills/<slug>/SKILL.md）。
      # 未设置时后端回落默认路径；容器内固定 /app/skills 并挂载宿主机卷持久化
      SKILL_LIBRARY_DIR: /app/skills
      # 备份状态卷（底座步 5）：读 backup 容器写入的 last_run.json，/api/status 状态灯数据源
      LUMEN_BACKUP_STATE_DIR: /var/lib/backup-state
    volumes:
      # 技能库持久化：安装的 skill 包存宿主机 ./skills，重建容器不丢失；
      # 手工放入的本地包（含 SKILL.md）放这里即被识别（管理弹窗显示为「本地」）
      - ./skills:/app/skills
      # 备份状态共享卷（backup 容器写、api 只读）：/api/status 的 backup 灯数据源
      - backup_state:/var/lib/backup-state:ro
      # pi-output 共享卷（pi-runner 写、api 只读）：步 5 主体校验 result.md/PDF 后入库
      - pi-output:/var/lib/pi-output:ro
    # 启动即迁移（Alembic 替代 create_all）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 本机备份（底座步 4，2026-10-25 拍板）：restic 加密增量备份 pg_dump + skills
  # 到宿主机异目录（防误删不防盘坏）。调度 = 容器内 sh 循环 24h（2 人规模不引
  # cron 守护）；状态灯数据源 = backup_state 卷 last_run.json（成功/失败都写）。
  backup:
    build:
      context: ./deploy/backup
    image: lumencafe-backup:0.2.0
    restart: unless-stopped
    # 备份脚本为唯一入口；--once 跑一轮即退（手动触发/验收用），默认 24h 循环
    entrypoint: ["sh", "/backup/backup.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      # 仓库加密口令：缺失时 compose 直接拒绝启动（失败要显式可见，不静默跳过备份）
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?请在 .env 配置 RESTIC_PASSWORD（长随机串，openssl rand -hex 32 生成）}
      RESTIC_REPOSITORY: /repo
      # pg_dump 目标（compose 内网直连 db；密码与 db 服务同源，不经公网）
      PGHOST: db
      PGUSER: lumencafe
      PGDATABASE: lumencafe
      PGPASSWORD: ${POSTGRES_PASSWORD:-lumencafe}
    volumes:
      # 仓库落盘宿主机异目录（本机拍板 E:/backups/lumencafe-restic，经 .env 覆盖；
      # 默认 ./backups/restic 保证无 .env 也能起）。服务器部署在 .env 改 Linux 路径。
      - ${BACKUP_REPO_HOST_PATH:-./backups/restic}:/repo
      # 状态文件共享卷：api 容器只读挂载 → /api/status 备份灯
      - backup_state:/state
      # 技能库只读参与备份
      - ./skills:/skills:ro
      # 备份脚本（仓库内版本化，改脚本即生效，无需重建镜像）
      - ./deploy/backup/backup.sh:/backup/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  # pi-runner：Pi Agent 执行沙箱（开发计划-pi-runner-v1 步 3 沙箱收紧 + 步 4 MCP 生态）。
  # 网络隔离：只通网关（caddy）与主体（api）——db/hatchet/backup 均不在 sandbox 网上，
  # 容器内够不到 PostgreSQL；出口仍走 NAT（步 3 默认档，收紧档见落地方案 §2 步 3）。
  # 文件系统：根只读 + /tmp 可写（tmpfs）；/output 与 /root/.pi/agent 用命名卷；
  # models.json / mcp.json 从宿主机只读挂入（单一来源 deploy/pi/）。
  pi-runner:
    build:
      context: .   # 仓库根（Dockerfile 需 COPY pi-runner/ 与 deploy/pi/）
      dockerfile: pi-runner/Dockerfile
    image: lumencafe-pi-runner:0.2.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 只绑宿主 loopback（管理面约束：不另开端口给外网；主体 api 走容器网内调用）
      - "127.0.0.1:8787:8787"
    networks: [sandbox]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      # 专用最小权限网关 token（gateway_tokens 表，只许 deepseek-flash；缺失即拒起）
      LUMEN_PI_TOKEN: ${LUMEN_PI_TOKEN:?请在 .env 配置 LUMEN_PI_TOKEN（pi-runner 专用网关 token）}
      # paper-search-mcp 走 uvx 运行时装包：国内镜像 + 缓存进 /tmp（根只读）
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      UV_CACHE_DIR: /tmp/uv-cache
      UV_TOOL_DIR: /tmp/uv-tools   # uvx 工具安装目录（根只读，须进 /tmp）
      NPM_CONFIG_CACHE: /tmp/npm-cache
      # Chromium 在只读根文件系统 + passwd HOME=/root 场景下需要可写 XDG 目录；
      # 否则 Playwright 启动浏览器会触发 crashpad 缺 --database 后 SIGTRAP。
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
      XDG_STATE_HOME: /tmp/.local/state
      # Playwright 默认跟随 XDG_CACHE_HOME 找浏览器；显式钉到镜像层，避免运行时装包。
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - pi-output:/output
      - pi-agent-home:/root/.pi/agent
      - ./deploy/pi/models.json:/root/.pi/agent/models.json:ro
      - ./deploy/pi/mcp.json:/root/.pi/agent/mcp.json:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      # exec 必须：uvx 的 venv 落在 /tmp（UV_CACHE_DIR），noexec 会挡 venv 可执行文件
      # 与 .so 的 PROT_EXEC mmap（2026-11-07 实测 Permission denied）。nosuid/nodev 保留。
      # 威胁模型内可接受：agent 本就有 bash/codemode 任意执行能力，noexec 无额外增益。
      - /tmp:exec,nosuid,nodev
      - /run
      - /workspace:exec,nosuid,nodev   # agent 的工作目录（scratch，结果一律落 /output 卷）
      # Playwright MCP 的用户数据/临时配置目录：包内硬编码 ~/.cache/ms-playwright-mcp；
      # /tmp 在运行时会被 tmpfs 覆盖，镜像里预建目录不可见，必须单独挂可写 tmpfs。
      - /root/.cache/ms-playwright-mcp:exec,nosuid,nodev
    mem_limit: 1g   # 落地方案 §2 步 3：比早前估的 512m 宽裕，实测后再降
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Hatchet 定时引擎（论文域步 B 拍板：lite 单容器，组件选型 §三）。
  # 引擎/控制台/API 一体（镜像内 8888=控制台+REST，7070=gRPC worker 接入）；
  # 复用现有 PG 的独立库 hatchet——部署时仅 CREATE DATABASE + ALTER DATABASE
  # SET TIMEZONE='UTC'（见 docs/部署指南-v1.md §7）；表与 btree_gist 扩展由引擎
  # 迁移自建（勿手工预建扩展：迁移内 CREATE EXTENSION 非幂等，预建即失败）；
  # 控制台经 Caddy /admin/hatchet 子路径反代（不公网暴露其他端口，仅管理员）。
  hatchet:
    # tag@digest 锁定（D6）：v0.114.2（2026-10-26）与 hatchet-sdk 1.43.1 同周发布的配套版。
    # ghcr 可见 tag 停在旧线（v0.63），版本以 GitHub release v0.114.2 为准；升级须走 D13。
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.114.2@sha256:a205018e4ec2c35af4df9c86cf1e36d4b74b36ebbc849c3b33ca18815cf22d6b
    restart: unless-stopped
    mem_limit: 512m  # 组件选型 §3.1 测算：引擎本体 200-400MB 级，封顶 512M
    env_file:
      - path: .env
        required: false
    environment:
      # cron 按引擎本地时区评估：每日 7:30 = 30 7 * * *（后端 papers_crawl_cron 同步配置）
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://lumencafe:${POSTGRES_PASSWORD:-lumencafe}@db:5432/hatchet?sslmode=disable
      # 对外 URL（含 Caddy 子路径）；服务器 IP 直连模式在 .env 用 HATCHET_SERVER_URL 覆盖
      SERVER_URL: ${HATCHET_SERVER_URL:-http://127.0.0.1/admin/hatchet}
      LITE_FRONTEND_BASE_PATH: /admin/hatchet/  # 控制台静态资源按子路径下发
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"  # 仅容器网内明文 gRPC（api worker 经 compose 内网接入）
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7070  # 写进 API token，worker 按名解析
      SERVER_AUTH_COOKIE_INSECURE: "t"  # 子路径反代走 HTTP（IP 直连自签场景）
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-127.0.0.1}  # 会话 cookie 域；经局域网 IP 访问控制台时改 .env
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      # 控制台初始管理员（首启种子；生产必须在 .env 覆盖，ADMIN_PASSWORD 需大小写+数字 8-64 位）
      ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:-Admin123!!}
      ADMIN_NAME: ${HATCHET_ADMIN_NAME:-Admin}
    volumes:
      # 首启生成的加密密钥与配置；删卷 = 既有 API token 全部作废须重建
      - hatchet_config:/config
    depends_on:
      db:
        condition: service_healthy

  # 本地反代：纯 IP 访问 http://127.0.0.1（或局域网 http://<本机IP>，手机调试用）→ api（SSE 不缓冲）。服务器部署用根目录 Caddyfile（IP 直连模式）
  caddy:
    # IP 直连模式用官方镜像即可（自签证书，无 DNS-01 需求）。
    # 切域名模式时改回：
    #   build: ./deploy/caddy
    #   image: lumencafe-caddy:latest
    # 详见 deploy/caddy/Dockerfile 与 docs/部署指南-v1.md §1.1
    # tag@digest 锁定（D6）：本地已审计版本（v2.11.7，≥2.11.4 已修 CVE-2026-27587 等）。
    # 远端 2-alpine 浮动 tag 已前移，钉 digest 保可复现；升级须走 D13 影响面评估。
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # 加入 sandbox 网：pi-runner 经 http://caddy/gw/v1 走网关（db 不在该网上）
    networks: [default, sandbox]
    environment:
      # 仅域名模式（DNS-01）需要：DNSPod API 令牌，格式「ID,Key」，在 .env 配置。
      # IP 模式下不使用，留着备用
      DNSPOD_TOKEN: ${DNSPOD_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      # 8443：未备案域名临时方案（80/443 被腾讯云拦截，见 Caddyfile 头部说明）；
      # 备案通过后随 Caddyfile 一起删掉这行
      - "8443:8443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

networks:
  # pi-runner 沙箱网（开发计划-pi-runner-v1 步 3）：成员 = pi-runner + caddy + api。
  # db/hatchet/backup 不在其上 → 沙箱内够不到 PostgreSQL；带 NAT 可出公网
  # （默认档；收紧档「出口域名白名单」见落地方案 §6，按需另起 egress 代理）。
  sandbox: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_state:
  hatchet_config:
  pi-output:
  pi-agent-home:
