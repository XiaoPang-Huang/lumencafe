<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>登录 · 流光咖啡馆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23d92d20'/%3E%3Cpath d='M12 5c-1.5 0-2.5 1.2-2.5 2.5 0 .4.1.8.2 1.2-1.1.8-1.9 2.2-1.9 3.8v4.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5v-4.5c0-1.6-.8-3-1.9-3.8.1-.4.2-.8.2-1.2C14.5 6.2 13.5 5 12 5Z' fill='white'/%3E%3C/svg%3E">
<!-- 页面 CSP：script-src 'self' / style-src 'self'——禁一切内联 JS 与样式，全部外链 /assets/ -->
<link rel="stylesheet" href="/assets/css/main.css?v=2a4">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1.8 0-3 1.4-3 3 0 .5.1 1 .3 1.4C7.9 8.4 7 10.1 7 12v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6c0-1.9-.9-3.6-2.3-4.6.2-.4.3-.9.3-1.4 0-1.6-1.2-3-3-3Z"/><path d="M9 18h6"/></svg>
        </span>
        <span>
          <div class="login-name">流光咖啡馆</div>
          <div class="login-sub">Lumen Cafe</div>
        </span>
      </div>
      <h1 class="login-title">账号登录</h1>
      <form id="loginForm" class="login-form" autocomplete="on">
        <label class="login-field" for="loginUser">
          <span class="login-label">用户名</span>
          <input class="text-input" id="loginUser" name="username" autocomplete="username" required>
        </label>
        <label class="login-field" for="loginPass">
          <span class="login-label">密码</span>
          <input class="text-input" type="password" id="loginPass" name="password" autocomplete="current-password" required>
        </label>
        <div class="login-error" id="loginError" role="alert" hidden></div>
        <button class="btn btn-primary login-btn" type="submit" id="loginBtn">登录</button>
      </form>
    </div>
  </main>
  <script src="/assets/js/login.js?v=2a4" defer></script>
</body>
</html>
