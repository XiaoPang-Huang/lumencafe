# 流光咖啡馆本地/服务器一体化编排：PostgreSQL 16 + FastAPI
# 用法：cp .env.example .env 后 `docker compose up -d --build`
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumencafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumencafe}
      POSTGRES_DB: lumencafe
    volumes:
      # PG 18+ 镜像要求挂载父目录 /var/lib/postgresql（数据存版本号子目录，便于未来 pg_upgrade）
      - pgdata:/var/lib/postgresql
    ports:
      # 暴露到宿主机，供本机 venv 直连开发/验证（compose 内 api 走服务名 db）
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumencafe -d lumencafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 2核4G 小池：与后端连接池 pool_size=5 + max_overflow=10（合计 ≤15 < 20）匹配
    command: ["postgres", "-c", "max_connections=20"]

  api:
    build:
      context: ./backend
      args:
        # 国内构建走清华镜像加速；服务器/CI 可在 .env 覆盖为官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    # .env 缺失时不拒绝启动（compose >= 2.24），由 config.py 的默认值兜底
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx;httpx.get('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # 业务日期边界（昨日/本周/本月）按北京时间切换；不设则容器默认 UTC 零点偏移 8 小时
      TZ: Asia/Shanghai
      # Skill 文件夹库根目录（Agent Skills 开放标准：skills/<slug>/SKILL.md）。
      # 未设置时后端回落默认路径；容器内固定 /app/skills 并挂载宿主机卷持久化
      SKILL_LIBRARY_DIR: /app/skills
    volumes:
      # 技能库持久化：安装的 skill 包存宿主机 ./skills，重建容器不丢失；
      # 手工放入的本地包（含 SKILL.md）放这里即被识别（管理弹窗显示为「本地」）
      - ./skills:/app/skills
    # 启动即迁移（Alembic 替代 create_all）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 本地反代：http://cafe.localhost → api（SSE 不缓冲）。服务器部署用根目录 Caddyfile（IP 直连模式）
  caddy:
    # IP 直连模式用官方镜像即可（自签证书，无 DNS-01 需求）。
    # 切域名模式时改回：
    #   build: ./deploy/caddy
    #   image: lumencafe-caddy:latest
    # 详见 deploy/caddy/Dockerfile 与 docs/部署指南-v1.md §1.1
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # 仅域名模式（DNS-01）需要：DNSPod API 令牌，格式「ID,Key」，在 .env 配置。
      # IP 模式下不使用，留着备用
      DNSPOD_TOKEN: ${DNSPOD_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      # 8443：未备案域名临时方案（80/443 被腾讯云拦截，见 Caddyfile 头部说明）；
      # 备案通过后随 Caddyfile 一起删掉这行
      - "8443:8443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # 自动化编排（可选组件）：胶水型任务编排，不直连数据库，仅通过 HTTP 调 API
  # 本地入口 http://localhost:5678 （Basic Auth）；流程里访问后端用 http://api:8000
  # 汉化：版本必须严格匹配（n8n 版本 = 汉化包版本），升级前先确认 bsi-bcp/n8n-i18n-chinese 是否跟进发版
  n8n:
    image: n8nio/n8n:2.43.5
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_DEFAULT_LOCALE: zh-CN
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      # 文献抓取工作流（n8n-workflows/papers-crawl.json）经 $env.LUMEN_INTERNAL_TOKEN
      # 调 /internal/jobs/*；不配则工作流里的环境变量取到空值
      LUMEN_INTERNAL_TOKEN: ${LUMEN_INTERNAL_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # 中文界面：不在此处挂载——dist 缺失时 Docker 会建空目录覆盖镜像内文件导致白屏。
      # 需要中文时用 deploy/docker-compose.n8n-zh.yml 覆盖层启用（自动下载见 deploy/n8n-zh-setup.sh）

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  n8n_data:
