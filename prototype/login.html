<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 流光咖啡馆</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">☕</div>
      <h1>流光咖啡馆</h1>
      <p>属于我们两个人的 AI 应用面板</p>
    </div>
    <form onsubmit="event.preventDefault(); location.href='dashboard.html';">
      <div class="field">
        <label for="u">用户名</label>
        <input id="u" type="text" placeholder="请输入用户名" value="island" autocomplete="username">
      </div>
      <div class="field">
        <label for="p">密码</label>
        <input id="p" type="password" placeholder="请输入密码" value="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-block" type="submit">进入咖啡馆</button>
    </form>
    <div class="login-foot">
      登录即代表同意内部使用约定 · v1.0 原型
    </div>
  </div>
</div>
</body>
</html>
