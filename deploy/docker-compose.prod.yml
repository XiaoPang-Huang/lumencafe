# 生产覆盖层：IP 直连 + 前端静态目录
# 用法（仓库根目录执行）：
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# 前置：.env 配好 LUMEN_JWT_SECRET / POSTGRES_PASSWORD / LUMEN_INTERNAL_TOKEN，
#       腾讯云防火墙放行 80/443/8443（域名未备案，全程 IP 直连，见 docs/部署指南-v1.md §1.1）
services:
  db:
    # 基础编排把 5432 发布到 0.0.0.0（本机 venv 开发用）；生产只走 compose 内网，
    # !reset 清掉发布，不依赖云防火墙兜底（双重保险）
    ports: !reset
  api:
    # 同理：8000 生产不对外，统一经 Caddy /api/* 反代入口
    ports: !reset

  caddy:
    volumes:
      # 服务器版 Caddyfile（IP 通配站点 + 自签证书）
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 前端原型即静态站，无需构建，整目录只读挂载
      - ./prototype/v2:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
